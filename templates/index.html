<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Vault</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-min-master="{{ min_master }}">

  <!-- Create / unlock -->
  <section id="auth" class="auth" hidden>
    <div class="auth-box">
      <h1 class="auth-title">Vault</h1>
      <p id="auth-lede" class="auth-lede"></p>
      <form id="auth-form" class="auth-form" autocomplete="off">
        <div>
          <label class="label" for="master">Master password</label>
          <input id="master" class="input" type="password" autocomplete="off" required>
        </div>
        <div id="confirm-wrap" hidden>
          <label class="label" for="master-confirm">Confirm master password</label>
          <input id="master-confirm" class="input" type="password" autocomplete="off">
        </div>
        <p id="auth-error" class="error" role="alert"></p>
        <div class="auth-actions">
          <button id="auth-submit" class="btn btn-primary" type="submit"></button>
          <button id="auth-check" class="btn btn-quiet" type="button">Strength check</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Vault -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">Vault</div>
      <div class="search">
        <label class="label" for="search" hidden>Search entries</label>
        <input id="search" class="input" type="search" placeholder="Search entries (press /)" autocomplete="off">
      </div>
      <div class="topbar-actions">
        <button id="add-btn" class="btn btn-primary" type="button">Add entry</button>
        <button id="check-btn" class="btn" type="button">Strength check</button>
        <button id="lock-btn" class="btn" type="button">Lock</button>
      </div>
    </header>
    <div class="main">
      <nav id="list" class="list" aria-label="Entries"></nav>
      <section id="detail" class="detail" aria-live="polite"></section>
    </div>
  </div>

  <!-- Add / edit entry -->
  <dialog id="entry-dialog" aria-labelledby="entry-title">
    <form id="entry-form" class="dialog-body" autocomplete="off">
      <h2 id="entry-title" class="dialog-title"></h2>
      <div>
        <label class="label" for="f-name">Name</label>
        <input id="f-name" class="input" maxlength="100" placeholder="GitHub" required>
      </div>
      <div>
        <label class="label" for="f-username">Username or email</label>
        <input id="f-username" class="input" maxlength="200" autocomplete="off">
      </div>
      <div>
        <label class="label" for="f-password">Password</label>
        <div class="row">
          <input id="f-password" class="input input-mono" type="password" maxlength="500" autocomplete="new-password" required>
          <button id="f-show" class="btn" type="button">Show</button>
        </div>
        <div class="tools" id="f-tools">
          <button id="f-generate" class="btn btn-small" type="button">Generate random</button>
          <button id="f-check" class="btn btn-small" type="button">Check strength</button>
        </div>
      </div>
      <div>
        <label class="label" for="f-url">Website</label>
        <input id="f-url" class="input" maxlength="300" placeholder="https://github.com">
      </div>
      <div>
        <label class="label" for="f-notes">Notes</label>
        <textarea id="f-notes" class="input" maxlength="2000"></textarea>
      </div>
      <p id="entry-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="entry-cancel" class="btn" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Save entry</button>
      </div>
    </form>
  </dialog>

  <!-- Strength check -->
  <dialog id="check-dialog" aria-labelledby="check-title">
    <div class="dialog-body">
      <h2 id="check-title" class="dialog-title">Strength check</h2>
      <form id="check-form" autocomplete="off">
        <label class="label" for="check-input">Password to check</label>
        <div class="row">
          <input id="check-input" class="input input-mono" type="password" autocomplete="off">
          <button id="check-show" class="btn" type="button">Show</button>
          <button class="btn btn-primary" type="submit">Check</button>
        </div>
        <p class="hint note">Checked on this computer only. Nothing you type here is saved.</p>
      </form>
      <p id="check-error" class="error" role="alert"></p>
      <div id="check-result" class="result"></div>
      <div class="dialog-actions">
        <button id="check-close" class="btn" type="button">Close</button>
      </div>
    </div>
  </dialog>

  <!-- Delete confirmation -->
  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <div class="dialog-body">
      <h2 id="delete-title" class="dialog-title"></h2>
      <p>This removes the login from your vault. It can't be undone.</p>
      <div class="dialog-actions">
        <button id="delete-cancel" class="btn" type="button">Keep entry</button>
        <button id="delete-confirm" class="btn btn-danger" type="button">Delete entry</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
